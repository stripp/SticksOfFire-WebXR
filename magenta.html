<html>
  <head>
    <title>Sticks of Fire – Magenta Vignette</title>

    <!-- A‑Frame Core -->
     <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Extras: nav-mesh + teleport -->
   <script src="javascript/aframe-extras.min.js"></script>

    <!-- A-Frame Particle System Component for rain -->
   <script src="javascript/aframe-particle-system-component.min.js"></script> 

    <!-- Pause sound until all is loaded -->
  <script>
    AFRAME.registerComponent('start-audio-on-vr', {
      init: function () {
        this.el.sceneEl.addEventListener('enter-vr', () => {
          // Explicitly resume the browser's audio context first
          if (THREE.AudioContext.getContext().state === 'suspended') {
            THREE.AudioContext.getContext().resume();
          }
          // Safely play preloaded sound component
          this.el.components.sound.playSound();
        });
      }
    });
  </script>

<script>
AFRAME.registerComponent('lightning-flash', {
  schema: {
    minDelay: {type: 'number', default: 2000},   // minimum time between flashes
    maxDelay: {type: 'number', default: 6000},   // maximum time between flashes
    flashDuration: {type: 'number', default: 120}, // how long bolt is visible
    flashCount: {type: 'number', default: 2}      // number of flickers per strike
  },

  init: function () {
    this.scheduleFlash();
  },

  scheduleFlash: function () {
    const delay = Math.random() * 
      (this.data.maxDelay - this.data.minDelay) + this.data.minDelay;

    setTimeout(() => this.doFlash(), delay);
  },

  doFlash: function () {
    const el = this.el;
    let flashes = 0;

    const flicker = () => {
      el.setAttribute('visible', true);

      setTimeout(() => {
        el.setAttribute('visible', false);
        flashes++;

        if (flashes < this.data.flashCount) {
          setTimeout(flicker, Math.random() * 80);
        } else {
          this.scheduleFlash();
        }
      }, this.data.flashDuration);
    };

    flicker();
  }
});
</script>

<script>
AFRAME.registerComponent('force-emissive', {
  schema: {
    color: {default: '#ffffff'},
    intensity: {default: 8}
  },

  init: function () {
    this.el.addEventListener('model-loaded', () => {
      const mesh = this.el.getObject3D('mesh');
      if (!mesh) return;

      mesh.traverse(node => {
        if (node.isMesh && node.material) {
          node.material.emissive = new THREE.Color(this.data.color);
          node.material.emissiveIntensity = this.data.intensity;
          node.material.color = new THREE.Color('#ffffff');
          node.material.needsUpdate = true;
        }
      });
    });
  }
});
</script>


  </head>

  <body>
    <a-scene
      background="color: #111"
      shadow="type: pcf"
      renderer="antialias: true"
      reflection="directionalLight: a-light#sunlight"
      xr-mode-ui="enabled: true"
      webxr="optionalFeatures: hand-tracking, layers"
      inspector="url: https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js"
      rain
    >

      <!-- ASSETS -->
      <a-assets>
	<audio id="magentaMusic" crossorigin="anonymous" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/magenta.mp3" crossorigin="anonymous" autoplay preload loop></audio>

	<a-asset-item id="navmesh" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/navMeshSimple.glb" crossorigin="anonymous"></a-asset-item>

        <a-asset-item id="park" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/magentaPark.glb" crossorigin="anonymous"></a-asset-item>


	<!-- MAGENTA ASSETS -->

	<a-asset-item id="dock" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/BobbingDock.glb" crossorigin="anonymous"></a-asset-item>
	<a-asset-item id="garbage" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/Trashbag.glb" crossorigin="anonymous"></a-asset-item>
	<a-asset-item id="jug" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/TrashJug.glb" crossorigin="anonymous"></a-asset-item>
	<a-asset-item id="strike" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/LightningBolt.glb" crossorigin="anonymous"></a-asset-item>

      </a-assets>

      <!-- CAMERA RIG -->
      <a-entity id="rig" movement-controls="speed: 0.15; fly: false; constrainToNavMesh: true; controls: gamepad, trackpad, keyboard, nipple;" position="4.5 0 13" rotation="0 10 0" gamepad-controls trackpad-controls keyboard-controls nipple-controls>
        <a-entity id="head"
                  camera
                  look-controls="pointerLockEnabled: true"
		  position="1 1.65 -1"
		  rotation>
         <a-cursor material raycaster cursor geometry position></a-cursor>
        </a-entity>
      </a-entity>

      <!-- ENVIRONMENT -->

      <!-- Nav Mesh -->
      <a-entity gltf-model="#navmesh"
	       id="nav"
               class="navmesh"
               nav-mesh
               position="0 -0.99 0"
   	       visible="false">
      </a-entity>

      <!-- LIGHTING -->
      <a-entity id="amb" light="type: ambient; intensity: .5" position="0 6 0"></a-entity>

      <a-entity id="sunlight" light="type: directional;
                       intensity: .2;
                       castShadow: true;
                       shadowMapHeight: 2048;
                       shadowMapWidth: 2048"
                position="4 5 11">
      </a-entity>

      <!-- SCENE OBJECTS -->
      <a-entity gltf-model="#park" id="magentaPark" position="0 -1 0"></a-entity>

      <a-cylinder id="fountainWater"
                  position="0 -0.15 0"
                  radius="4"
                  height=".005"
                  color="#00ccff"
                  transparent="true"
                  opacity="0.4">
      </a-cylinder>

	<!-- MAGENTA VIGNETTE OBJECTS -->

	<a-entity gltf-model="#dock" id="bobbingDock" 
	  rotation="5 65 5" 
	  position="14.5 -1 11" 
	  scale="1 1 1"
	  animation="property: position; 
	  easing: easeInOutQuad; 
	  dir: alternate; 
	  dur: 2000; 
	  to: 14.5 -0.7 11.1; 
	  loop: true"></a-entity>

	<a-entity gltf-model="#jug" id="plasticJug" 
	  rotation="0 180 45" 
	  position="1 -.6 8.5" 
	  scale="1 1 1"
	  animation="property: position;
	  easing: easeInOutQuad;
	  dir: alternate;
	  dur: 1000;
	  to: 1 -.4 8.5;
	  loop: true"></a-entity>
	<a-entity gltf-model="#garbage" id="trashBag" 
	  rotation="60 180 0" 
	  position="3 -.5 8" 
	  scale="1 1 1"
	  animation="property: position;
	  easing: easeInOutQuad;
	  dir: alternate;
	  dur: 1500;
	  to: 3.05 -.2 8;
	  loop: true"></a-entity>
	<a-ocean color="#114444" depth="1" width="40" opacity=".9" position="0 -.5 0" rotation="-90 0 0" scale="1 40 1"></a-ocean>

<!-- Lightning Meshes -->

	<a-entity gltf-model="#strike" id="bolt1"
          lightning-flash="minDelay:1500; maxDelay:5000; flashCount:3"
          force-emissive="color:#fff; intensity:10"
          rotation="0 0 0" position="-25 1 -25" scale="8 8 8">
	</a-entity>

	<a-entity gltf-model="#strike" id="bolt2"
          lightning-flash="minDelay:2000; maxDelay:7000; flashCount:2"
          force-emissive="color:#fff; intensity:10"
          rotation="0 0 0" position="8 1 25" scale="7 7 7">
	</a-entity>

	<a-entity gltf-model="#strike" id="bolt3"
          lightning-flash="minDelay:2000; maxDelay:7000; flashCount:2"
          force-emissive="color:#fff; intensity:10"
          rotation="0 0 0" position="25 1 -5" scale="8 8 8">
	</a-entity>

	
	<!-- RAIN -->

<a-entity id="rain"
  particle-system="
    preset: rain;
    particleCount: 8000;
    size: 0.15;
    maxAge: 1.2;

    // spawn area
    positionSpread: 40 0 40;

    // diagonal wind
    velocityValue: -2 -25 0;
    velocitySpread: 1 5 1;

    // gravity-like pull
    accelerationValue: -1 -40 0;
    accelerationSpread: 0.5 10 0.5;

    // appearance
    color: #88aaff;
    opacity: 0.9;
  "
  position="0 20 0"
></a-entity>


	<!-- MAGENTA VIGNETTE TEXT -->

	<a-entity id="lightningCapital" text="

value: Could 'sticks of fire' be a reference\n
to lightning? Tampa is known for its \n
powerful thunderstorms, so much so that\n
it has been called the 'lightning capital'\n 
of North America. Is that really true? In \n
some years, the region has had more lightning\n
activity than any other. But other areas \n
of Florida and elsewhere in the U.S. also\n
are contenders for the title, according to\n
meteorologists.;

	align: left;
	baseline: bottom;
	color: white"

	position="-9 .5 7.5"
	rotation="0 150 0"
	scale="4 4 4">
	</a-entity>

	<a-entity id="stormPride" text="

value: As with many communities, Tampa's \n
ferocious storms elicit a combination\n
of dread and pride among its residents.\n
Yet, after being lashed by two major \n
hurricanes in 2024, boastfulness has\n
given way to a growing sense of\n
vulnerability as warming seas lead\n
to more potent storms.;

	align: left;
	baseline: bottom;
	color: white"

	position="-9 .5 -9"
	rotation="0 60 0"
	scale="4 4 4">
	</a-entity>

    </a-scene>
  </body>
</html>
