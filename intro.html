<html>
  <head>
    <title>Sticks of Fire – Plant Park</title>

    <!-- A‑Frame Core -->
    <script src="https://aframe.io/releases/1.8.0/aframe.min.js"></script>

    <!-- Extras: nav-mesh + teleport -->
   <script src="javascript/aframe-extras.min.js"></script>

    <!-- Pause sound until all is loaded -->
  <script>
    AFRAME.registerComponent('start-audio-on-vr', {
      init: function () {
        this.el.sceneEl.addEventListener('enter-vr', () => {
          // Explicitly resume the browser's audio context first
          if (THREE.AudioContext.getContext().state === 'suspended') {
            THREE.AudioContext.getContext().resume();
          }
          // Safely play preloaded sound component
          this.el.components.sound.playSound();
        });
      }
    });
  </script>

  </head>

  <body>
    <a-scene
      shadow="type: pcf"
      renderer="antialias: true"
      reflection="directionalLight: a-light#sunlight"
      xr-mode-ui="enabled: true"
      webxr="optionalFeatures: hand-tracking, layers"
      inspector="url: https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js"
    >

      <!-- ASSETS -->
      <a-assets>
        <img id="plantPark" src="images/background.png">
	<audio id="parkAmbient" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/PlantParkAmbix.mp3" crossorigin="anonymous" preload="auto"></audio>
	<a-asset-item id="navmesh" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/navMeshSimple.glb" crossorigin="anonymous"></a-asset-item>        
	<a-asset-item id="park" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/newParkLit2.glb" crossorigin="anonymous"></a-asset-item>
      </a-assets>

      <!-- CAMERA RIG -->
      <a-entity id="rig" movement-controls="speed: 0.15; fly: false; constrainToNavMesh: true; controls: gamepad, trackpad, keyboard, nipple;" position="4.5 0 13" rotation="0 10 0" gamepad-controls trackpad-controls keyboard-controls nipple-controls>
        <a-entity id="head"
                  camera
                  look-controls="pointerLockEnabled: true"
		  position="1 1.65 -1"
		  rotation>
         <a-cursor material raycaster cursor geometry position></a-cursor>
        </a-entity>
      </a-entity>

      <!-- ENVIRONMENT -->

      <!-- Background dome -->
      <a-sphere id="background"
                position="0 1 0"
                rotation="0 45 0"
                radius="15"
                src="#plantPark"
                material="side: back; shader: flat"
		metadata="unlit"
                shadow="receive: false; cast: false">
      </a-sphere>

      <!-- Nav Mesh -->
      <a-entity gltf-model="#navmesh"
	       id="nav"
               class="navmesh"
               nav-mesh
               position="0 -0.99 0"
   	       visible="false">
      </a-entity>

      <!-- LIGHTING -->
      <a-entity id="amb" light="type: ambient; intensity: 5" position="0 3 0"></a-entity>

      <a-entity id="sunlight" light="type: directional;
                       intensity: 4;
                       castShadow: true;
                       shadowMapHeight: 2048;
                       shadowMapWidth: 2048" 
                       position="4 5 11">
      </a-entity>

	<!-- AUDIO -->
 
	<a-entity sound="src: #parkAmbient; autoplay: true; loop: true; refDistance: 20; maxDistance: 2" position="0 2 0"></a-entity>

      <!-- SCENE OBJECTS -->
      <a-entity gltf-model="#park" id="parkScene" position="0 -1 0"></a-entity>

      <a-cylinder id="fountainWater"
                  position="0 -0.15 0"
                  radius="4"
                  height=".005"
                  color="#00ccff"
                  transparent="true"
                  opacity="0.4">
      </a-cylinder>

    </a-scene>
  </body>
</html>
