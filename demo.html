<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Demo</title>

    <!-- A‑Frame Core -->
    <script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>

    <!-- Extras: nav-mesh + teleport -->
   <script src="javascript/aframe-extras.min.js"></script>

<style>

h1 {
  font-family: Arial, Helvetica, sans-serif;
  text-align: center;
  margin-top: 10px;
  font-size: 2.2rem;	
  padding: 0;
  color: #333
}

p {
  font-family: Georgia, serif;
  background-color: var(--light-gray-bg); /* lighter, cleaner */
  color: #222;
  max-width: 800px;
  margin: 40px auto;
  line-height: 1.6;
  padding: 0 20px;
  padding-bottom: 50px;
}

  #VR-scene {
    width: 1200px;
    height: 800px;
    display: flex;
    justify-content: center;
    border: 2px solid #444;
      }

  a-scene {
    width: 100%;
    height: 100%;
  }
</style>

  </head>

  <body>

<h1>WebXR VR Demo</h1>
<p>A quick demo of proof of concept of embedded WebXR using A-Frame.</p>

<div id="VR-scene">

    <a-scene embedded
      shadow="type: pcfsoft"
      renderer="antialias: true; colorManagement: false; exposure: 1.0; toneMapping: None"
      xr-mode-ui="enabled: true"
      webxr="optionalFeatures: hand-tracking, layers"
      inspector="url: https://cdn.jsdelivr.net/gh/aframevr/aframe-inspector@master/dist/aframe-inspector.min.js"
    >

      <!-- ASSETS -->
      <a-assets>
        <img id="studio" src="images/studio-4k.png">
        <img id="carpetBase" src="images/carpetPinkB.jpg">
        <img id="carpetNormal" src="images/carpetN.png">

        <a-asset-item id="chair" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/chair.glb"></a-asset-item>
        <a-asset-item id="table" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/table.glb"></a-asset-item>
        <a-asset-item id="plant" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/pottedPlant.glb"></a-asset-item>
        <a-asset-item id="chandelier" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/chandelier.glb"></a-asset-item>
        <a-asset-item id="vase" src="https://sof-webxr-assets.s3.us-east-2.amazonaws.com/meshes/vase.glb"></a-asset-item>

      </a-assets>

      <!-- CAMERA RIG -->
      <a-entity id="rig" movement-controls="speed: 0.15; fly: false" position="0 1.1 0" rotation="0 10 0">
        <a-entity id="camera"
                  camera
                  look-controls="pointerLockEnabled: true"
                  wasd-controls="acceleration: 20">
        </a-entity>
      </a-entity>

      <!-- CONTROLLERS -->
      <a-entity id="rightHand"
                laser-controls="hand: right"
                teleport-controls="
                  cameraRig: #rig;
                  teleportOrigin: #camera;
                  button: trigger;
                  type: parabolic;
                  curveShootingSpeed: 6;">
      </a-entity>

      <a-entity id="leftHand" laser-controls="hand: left"></a-entity>

      <!-- HAND TRACKING -->
      <a-entity hand-tracking-controls="hand: left"></a-entity>
      <a-entity hand-tracking-controls="hand: right"></a-entity>

      <!-- ENVIRONMENT -->

      <!-- Background dome -->
      <a-sphere id="studioBG"
                position="0 1 0"
                rotation="0 0 0"
                radius="4"
                src="#studio"
                material="side: back; shader: flat"
		metadata="unlit"
                shadow="receive: false; cast: false">
      </a-sphere>

      <!-- Ground -->
      <a-plane id="floor"
               position="0 -1 1"
               rotation="-90 0 0"
               width="10"
               height="10"
	       src="#carpetBase"
               repeat="8 8"
               normal-map="#carpetNormal"
               normal-texture-repeat="8 8"
               roughness="0.8"
               shadow="receive: true">
      </a-plane>

      <!-- LIGHTING -->
      <a-entity id="ambLight" light="type: ambient; intensity: 4" position="0 0 0"></a-entity>
      <a-entity id="point" light="type: point; intensity: 5" position="-0.8 3.2 -2"></a-entity>

      <!-- SCENE OBJECTS -->
      <a-entity gltf-model="#chair" id="armchair" scale="1 1 1" position="0.5 -1 -1.75" rotation="0 -15 0" shadow="cast: true"></a-entity>
      <a-entity gltf-model="#table" id="smallTable" scale="1 1 1" position="-0.8 -1 -2" rotation="0 15 0" shadow="cast: true; receive: true"></a-entity>
      <a-entity gltf-model="#chandelier" id="hangingLight" scale="1.5 1.5 1.5" position="0 4 0" rotation="0 0 0" shadow="cast: true"></a-entity>
      <a-entity gltf-model="#vase" id="antiqueVase" scale="1 1 1" position="-0.8 -0.26 -2" rotation="0 0 0" shadow="cast: true"></a-entity>
      <a-entity gltf-model="#plant" id="pottedPlant" scale="1 1 1" position="-1.5 -1 2.5" rotation="0 0 0" shadow="cast: true"></a-entity>

    </a-scene>

</div>
  </body>
</html>
